name: build

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on: 
  push:
    branches:
      - master
    paths:
      - .github/workflows/build.yml
      - '**/*.html'
      - 'assets/**'
      - 'i18n/**'
      - 'templates/**'
      - 'render-i18n.ps1'
      - 'generate-releases.ps1'
      - 'versions/**'
      - 'build.ps1'
      - 'sponsor/**'
      - 'wasm/**'
      - '_headers'
  repository_dispatch:
    types: [forward-push]
  workflow_dispatch:
    inputs:
      min_doc_ver:
        # actions run ID
        description: 'Please min doc version to build, example: 2.7'
        # Default value if no value is explicitly provided
        default: '2.7'
        # Input has to be provided for the workflow to run
        required: true
env:
  DEFAULT_MIN_DOC_VER: '2.7'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts from workflow build
      uses: dawidd6/action-download-artifact@v24
      with:
        # Optional, GitHub token
        github_token: ${{secrets.GITHUB_TOKEN}}
        # Required, workflow file name or ID
        workflow: build.yml
        workflow_conclusion: success
        branch: dev
        name: wasm
        path: tmp/wasm
        repo: axmolengine/axmol
    
    - name: Build HTML site
      shell: pwsh
      run: |
        ls -r tmp/wasm
        git clone https://github.com/axmolengine/axmol.git tmp/axmol-src
        git -C tmp/axmol-src checkout dev
        $min_doc_ver = '${{ github.event.inputs.min_doc_ver }}'
        if (!$min_doc_ver) { $min_doc_ver = '${{ env.DEFAULT_MIN_DOC_VER }}'}
        ./build.ps1 tmp/axmol-src tmp/wasm -min_doc_ver $min_doc_ver

    # dist is force-orphaned onto the publish branch, so a silently missing registry
    # would delete it from the live site. Fail before publishing instead.
    - name: Verify version registry
      shell: pwsh
      run: |
        if (!(Test-Path ./dist/versions/index.json -PathType Leaf)) { throw 'dist/versions/index.json missing' }
        $registry = Get-Content ./dist/versions/index.json -Raw | ConvertFrom-Json
        if (!@($registry.versions).Count) { throw 'dist/versions/index.json has no versions' }
        if (!(Test-Path ./dist/versions/schema/v1.json -PathType Leaf)) { throw 'version schema missing' }
        # The homepage and v3 page bake the latest LTS release link at build time
        # (via {{release:latestUrl}}); assert it actually landed in both pages.
        $latest = $registry.channels.lts.latest
        $homeHtml = Get-Content ./dist/index.html -Raw
        if (!$homeHtml.Contains("releases/tag/v$latest")) { throw "homepage is missing the baked v$latest release link" }
        $v3Html = Get-Content ./dist/v3/index.html -Raw
        if (!$v3Html.Contains("releases/tag/v$latest")) { throw "v3 page is missing the baked v$latest release link" }
        $hubHtml = Get-Content ./dist/hub/index.html -Raw
        $hubVersionMatch = [regex]::Match($hubHtml, 'Current version:\s*v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)')
        if (!$hubVersionMatch.Success) { throw 'Hub page is missing its baked current version' }
        $hubVersion = $hubVersionMatch.Groups['version'].Value
        if (!$hubHtml.Contains("releases/download/v$hubVersion/axmol-hub-$hubVersion-win-x64.exe")) { throw "Hub page is missing the v$hubVersion Windows installer link" }
        if (!$hubHtml.Contains("releases/download/v$hubVersion/axmol-hub-$hubVersion-win-arm64.exe")) { throw "Hub page is missing the v$hubVersion Windows ARM64 installer link" }
        if (!$hubHtml.Contains("releases/download/v$hubVersion/axmol-hub-linux-x64.AppImage")) { throw "Hub page is missing the v$hubVersion Linux AppImage link" }
        if (!$hubHtml.Contains("releases/download/v$hubVersion/axmol-hub-linux-arm64.AppImage")) { throw "Hub page is missing the v$hubVersion Linux ARM64 AppImage link" }
        if (!$hubHtml.Contains("releases/download/v$hubVersion/axmol-hub-$hubVersion-osx-arm64.pkg")) { throw "Hub page is missing the v$hubVersion macOS Apple silicon installer link" }
        if (!$hubHtml.Contains("releases/download/v$hubVersion/axmol-hub-$hubVersion-osx-x64.pkg")) { throw "Hub page is missing the v$hubVersion macOS Intel installer link" }
        foreach ($html in (Get-ChildItem ./dist -Filter index.html -Recurse)) {
          $content = Get-Content $html.FullName -Raw
          if ($content.Contains('{version}') -or $content -match '\{\{release:') { throw "$($html.FullName) has unresolved tokens" }
        }
        if (Test-Path ./dist/assets/js/latest-stable.js) { throw 'latest-stable.js should no longer be published' }
        Write-Host "Registry ok: Axmol $latest ($(@($registry.versions).Count) versions), Hub v$hubVersion, baked into site pages"
    
    # Commit html site pages to repo: axmolengine/axmol.dev.dist
    - name: Commit HTML site pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        personal_token: ${{ secrets.AXMOL_DEV_DIST_PAT }}
        external_repository: axmolengine/axmol.dev.dist
        publish_dir: ./dist
        enable_jekyll: false
        allow_empty_commit: false
        force_orphan: true
        publish_branch: axmol-pages
        cname: axmol.dev
